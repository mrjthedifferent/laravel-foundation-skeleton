name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    name: PHP ${{ matrix.php }}
    env:
      # The foundation is installed from GitHub; the token avoids API rate limits.
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, fileinfo
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        if: matrix.php == '8.4'
        run: vendor/bin/pint --test

      # The shared guidelines and tooling files match the installed foundation version.
      - name: Synced files are current
        if: matrix.php == '8.4'
        run: php artisan foundation:sync --check

      - name: Build assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Tests
        run: php artisan test
